name: Auto-Update Rave Music

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run music fetcher
        env:
          MUSIC_API_KEY: ${{ secrets.MUSIC_API_KEY }}
        run: python fetch_music.py

      - name: Commit and push new tracks
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add music/
          git diff --staged --quiet || git commit -m "Add new royalty-free rave tracks"
          git push
